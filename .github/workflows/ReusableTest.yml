name: Reusable test

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: "1"
      os:
        required: false
        type: string
        default: ubuntu-latest
      arch:
        required: false
        type: string
        default: x64
      allow_failure:
        required: false
        type: boolean
        default: false
      run_codecov:
        required: false
        type: boolean
        default: false
    secrets:
      codecov_token:
        # Optional on purpose: pull requests from forks never receive secrets, and a
        # `required: true` secret makes the whole workflow call fail for an outside
        # contributor before a single test runs. The upload step below skips itself
        # when the token is absent.
        required: false

jobs:
  test:
    name: Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.arch }} - ${{ github.event_name }}
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.allow_failure }}

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.version }}
          arch: ${{ inputs.arch }}
      - name: Use Julia cache
        uses: julia-actions/cache@v3
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        # Local addition on top of BestieTemplate (which has no multi-threading option, as of
        # v0.18.6): run the suite multi-threaded — the package's tmap concurrency (rectification
        # building, run tracking) is otherwise never exercised on CI. "auto" = all runner cores.
        env:
          JULIA_NUM_THREADS: "auto"
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ inputs.run_codecov }}
      - uses: codecov/codecov-action@v7
        # Skipped when no token is available, which is exactly the fork-PR case.
        if: ${{ inputs.run_codecov && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.codecov_token }}
        with:
          # `files`, plural: v7 renamed the singular `file`, and an unknown input is only a
          # warning, so the old name was silently ignored and the upload fell back to searching
          # the tree. That happened to find lcov.info, which is why coverage still worked.
          files: lcov.info
          token: ${{ secrets.codecov_token }}
          # Now that this step only runs when a token exists, a failed upload is a real
          # failure rather than an unavoidable one. codecov.yml asserts 90% project and
          # patch targets; silently skipping the upload would leave those unenforced.
          fail_ci_if_error: true
