name: Reusable test

on:
  workflow_call:
    inputs:
      version:
        required: false
        type: string
        default: "1"
      os:
        required: false
        type: string
        default: ubuntu-latest
      arch:
        required: false
        type: string
        default: x64
      allow_failure:
        required: false
        type: boolean
        default: false
      run_codecov:
        required: false
        type: boolean
        default: false
      run_static:
        # Whether this leg runs the platform-independent static analysis — today that means JET.
        # Defaults to true so a local `Pkg.test()` and any caller that does not think about it
        # keep the full suite; Test.yml and TestOnPRs.yml set it false on everything but ubuntu.
        required: false
        type: boolean
        default: true
    secrets:
      codecov_token:
        # Optional on purpose: pull requests from forks never receive secrets, and a
        # `required: true` secret makes the whole workflow call fail for an outside
        # contributor before a single test runs. The upload step below skips itself
        # when the token is absent.
        required: false

jobs:
  test:
    name: Julia ${{ inputs.version }} - ${{ inputs.os }} - ${{ inputs.arch }} - ${{ github.event_name }}
    runs-on: ${{ inputs.os }}
    continue-on-error: ${{ inputs.allow_failure }}

    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: ${{ inputs.version }}
          arch: ${{ inputs.arch }}
      - name: Use Julia cache
        uses: julia-actions/cache@v3
        with:
          # Name the cache for what it actually holds — a depot for one OS and one Julia version —
          # instead of for the workflow that happened to fill it.
          #
          # The default prefix is `julia-cache;workflow=<workflow>;job=<job>`, which put Test and
          # TestOnPRs on separate lines for byte-identical depots. Because a cache written on a
          # branch is only visible to that branch, while one written on the default branch is
          # visible to all of them, that naming meant a PR job could never restore main's depot and
          # started cold every time. The sizes said so plainly: 319 MB and 365 MB on the TestOnPRs
          # keys against 1408 MB and 1455 MB on Test's, and PR legs that swung 2.4x run to run
          # (windows 441 s then 1071 s on the same branch). Dropping `workflow=` lets a PR restore
          # what main last saved.
          #
          # `version=` is here for a different reason, and is deliberate rather than redundant
          # while the matrix pins a single minor: the default key never carried the Julia version
          # at all, because julia-actions/cache builds it from `toJSON(matrix)`, and inside a
          # REUSABLE workflow the matrix context is empty — the matrix lives in the caller. So when
          # the matrix held two minors, both legs on one OS shared a key and overwrote each other's
          # `compiled/`. Pinning one version fixed that by accident; naming the version fixes it on
          # purpose, so raising the pin starts a clean line instead of thrashing against the old one.
          cache-name: julia-cache;version=${{ inputs.version }}
          # A failed job's depot is not worth a cache generation. The default saves regardless,
          # which spends quota on runs whose state we would rather not inherit — and the repository
          # sits at 9.9 GB against a 10 GB cap, where eviction is already in play.
          save-always: false
      - uses: julia-actions/julia-buildpkg@v1
      - uses: julia-actions/julia-runtest@v1
        with:
          # julia-runtest defaults `coverage` to true, and nothing here used to override it, so
          # every leg instrumented the package while only the `run_codecov` leg processed or
          # uploaded the result — five of six legs in Test.yml, one of two in TestOnPRs.yml,
          # producing lcov data that was then discarded. Tying it to the same input as the two
          # steps below means the instrumentation happens exactly where it is read.
          #
          # Measured at +6.5% on the suite (391.8 s -> 417.1 s locally, threaded). Small, because
          # `Pkg.test(coverage=true)` resolves to `--code-coverage=@<pkgroot>` (Pkg's
          # Operations.jl, `gen_subprocess_flags`) rather than `user` — instrumenting the whole
          # dependency stack would cost roughly 3x, and is not what runs here.
          coverage: ${{ inputs.run_codecov }}
        # Local addition on top of BestieTemplate (which has no multi-threading option, as of
        # v0.18.6): run the suite multi-threaded — the package's tmap concurrency (rectification
        # building, run tracking) is otherwise never exercised on CI. "auto" = all runner cores.
        env:
          JULIA_NUM_THREADS: "auto"
          # Read by test/runtests.jl. JET is a whole-package abstract interpretation, so running it
          # once per OS was always redundant — and on Julia 1.13 it turned out to be actively
          # harmful: `@test_opt` on `inv_lens_distortion` passes on ubuntu and fails on windows,
          # because the `@warn` inside it reaches Base.CoreLogging -> wait() -> OncePerThread, where
          # JET reports "failed to optimize due to recursion". Same Julia, same source, different
          # answer per platform. See DECISIONS, "JET runs once, on ubuntu".
          FROMAGE_RUN_STATIC: ${{ inputs.run_static }}
      - uses: julia-actions/julia-processcoverage@v1
        if: ${{ inputs.run_codecov }}
      - uses: codecov/codecov-action@v7
        # Skipped when no token is available, which is exactly the fork-PR case.
        if: ${{ inputs.run_codecov && env.CODECOV_TOKEN != '' }}
        env:
          CODECOV_TOKEN: ${{ secrets.codecov_token }}
        with:
          # `files`, plural: v7 renamed the singular `file`, and an unknown input is only a
          # warning, so the old name was silently ignored and the upload fell back to searching
          # the tree. That happened to find lcov.info, which is why coverage still worked.
          files: lcov.info
          token: ${{ secrets.codecov_token }}
          # Now that this step only runs when a token exists, a failed upload is a real
          # failure rather than an unavoidable one. codecov.yml asserts 90% project and
          # patch targets; silently skipping the upload would leave those unenforced.
          fail_ci_if_error: true
