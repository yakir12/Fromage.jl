name: Docs

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
      - ".github/workflows/Docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
      - ".github/workflows/Docs.yml"
    types: [opened, synchronize, reopened]
  # AutoRelease dispatches this workflow on the release tag, because tags
  # pushed with GITHUB_TOKEN do not trigger tag-push workflows on their own.
  # workflow_dispatch ignores path filters, so the tag build always runs.
  workflow_dispatch:

concurrency:
  # Keyed on the resource, not the ref (#125). Every job in this repository that writes
  # to gh-pages — this workflow deploying main, this workflow deploying a PR preview, and
  # DocPreviewCleanup.yml — shares this one group, so they serialize instead of racing.
  #
  # The old group was `${{ github.workflow }}-${{ github.ref }}`, which only stopped a ref
  # from racing itself. A merge to main and an open PR's preview are different refs in
  # different groups, so both deployed to the one branch they share and the loser died with
  # `! [rejected] HEAD -> gh-pages (fetch first)`.
  #
  # cancel-in-progress must stay false: a cancelled deploy can leave gh-pages half-written,
  # and DocPreviewCleanup force-pushes, so it must start from a checkout taken after any
  # in-flight deploy has finished. The cost is that a PR preview no longer cancels its own
  # superseded builds; GitHub still keeps only one run pending per group, so rapid pushes
  # collapse to the newest rather than queueing without bound.
  group: gh-pages
  cancel-in-progress: false

permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write

jobs:
  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy docs
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: Documenter
