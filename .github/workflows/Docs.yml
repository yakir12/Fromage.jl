name: Docs

on:
  push:
    branches:
      - main
    tags:
      - '*'
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
      - ".github/workflows/Docs.yml"
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
      - "*.toml"
      - ".github/workflows/Docs.yml"
    types: [opened, synchronize, reopened]
  # AutoRelease dispatches this workflow on the release tag, because tags
  # pushed with GITHUB_TOKEN do not trigger tag-push workflows on their own.
  # workflow_dispatch ignores path filters, so the tag build always runs.
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

permissions:
  actions: write
  contents: write
  pull-requests: read
  statuses: write

jobs:
  docs:
    name: Build and deploy documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: julia-actions/setup-julia@v3
        with:
          version: '1'
      - uses: julia-actions/cache@v3
      - name: Instantiate docs environment
        run: julia --project=docs -e 'using Pkg; Pkg.instantiate()'
      - name: Build and deploy docs
        run: julia --project=docs docs/make.jl
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          JULIA_DEBUG: Documenter
