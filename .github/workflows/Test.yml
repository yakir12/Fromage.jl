name: Test

on:
  push:
    branches:
      - main
    tags: ["*"]
  workflow_dispatch:

# julia-actions/cache runs with delete-old-caches: true, which needs `actions: write`
# to prune superseded caches. The repository default is read-only, and permissions can
# only be maintained or reduced down a reusable-workflow chain — never elevated — so
# this has to be granted here, in the caller, not inside ReusableTest.yml.
permissions:
  actions: write
  contents: read

concurrency:
  # One run per ref. Never cancel in progress: AutoRelease gates on this workflow's
  # conclusion, and a cancelled run reports "cancelled", which would silently skip
  # the release for that commit.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/ReusableTest.yml
    with:
      os: ${{ matrix.os }}
      version: ${{ matrix.version }}
      arch: ${{ matrix.arch }}
      allow_failure: ${{ matrix.allow_failure }}
      run_codecov: ${{ matrix.version == '1' && matrix.os == 'ubuntu-latest' }}
    secrets:
      codecov_token: ${{ secrets.CODECOV_TOKEN }}
    strategy:
      fail-fast: false
      matrix:
        version:
          - "1.11"
          - "1"
        os:
          - ubuntu-latest
          # Local deviation from BestieTemplate's macOS-latest: those runners are Apple Silicon,
          # where AprilTags_jll has no aarch64-apple-darwin binaries (libapriltag never loads).
          # Test Intel macOS (supported by GitHub into 2027) until upstream ships arm64 binaries —
          # see todo.md "Apple Silicon (aarch64 macOS) support".
          - macos-15-intel

          - windows-latest
          
        arch:
          # Local deviation from BestieTemplate (which pins x64, as of v0.18.6): "default"
          # resolves to each runner's native arch (x64 on all three today) — setup-julia@v3
          # (Dependabot-bumped from the template's v2) hard-errors on an arch/runner mismatch,
          # so this keeps working if an arm64 runner ever (re)enters the matrix.
          - default
        allow_failure: [false]
