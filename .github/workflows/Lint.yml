name: Lint

on:
  # Link rot happens on someone else's schedule, not on ours: a URL that worked at merge
  # time can die a month later without anything in this repo changing. A weekly sweep
  # catches that, while gating every push on a live network call only bought flaky runs.
  schedule:
    - cron: "0 0 * * 1" # Mondays, 00:00 UTC
  pull_request:
    branches:
      - main
    # `simulation/**` is excluded here and, for the weekly sweep, in `.lychee.toml`: the
    # CalibrationRigSimulation package runs no CI until its behaviour earns it (#289, #297;
    # DECISIONS.md, "The simulation runs no CI and cuts no release"). The exclusion must come
    # after the `**/*.md` it carves out of.
    paths:
      - "docs/**"
      - "**/*.md"
      - ".lychee.toml"
      - ".github/workflows/Lint.yml"
      - "!simulation/**"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  link-checker:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # GitHub sometimes answers the runner with 503 for a page that is up (#423), and lychee
      # never retries a rejected status other than 429, whatever `max_retries` says. So the check
      # runs twice: `--cache` keeps every link that passed and drops every one that failed, so the
      # second pass re-fetches only the failures, two minutes later. A transient refusal clears on
      # it; a dead link fails both. The report goes outside the checkout, or the second pass would
      # check the first one's list of failures as if it were documentation.
      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: false
          output: ${{ runner.temp }}/lychee/first-pass.md
          args: --config '.lychee.toml' --cache --max-cache-age 1d .

      - name: Wait before re-checking the links that failed
        if: steps.lychee.outputs.exit_code != 0
        run: sleep 120

      - name: Link Checker (failures only)
        if: steps.lychee.outputs.exit_code != 0
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          output: ${{ runner.temp }}/lychee/second-pass.md
          args: --config '.lychee.toml' --cache --max-cache-age 1d .
