name: Lint

on:
  # Link rot happens on someone else's schedule, not on ours: a URL that worked at merge
  # time can die a month later without anything in this repo changing. A weekly sweep
  # catches that, while gating every push on a live network call only bought flaky runs.
  schedule:
    - cron: "0 0 * * 1" # Mondays, 00:00 UTC
  pull_request:
    branches:
      - main
    paths:
      - "docs/**"
      - "**/*.md"
      - ".lychee.toml"
      - ".github/workflows/Lint.yml"
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  # Skip intermediate builds: always.
  # Cancel intermediate builds: only if it is a pull request build.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  link-checker:
    name: Link checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Link Checker
        id: lychee
        uses: lycheeverse/lychee-action@v2
        with:
          fail: true
          args: --config '.lychee.toml' .
